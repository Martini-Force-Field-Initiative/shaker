name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: pre-commit/action@v3.0.1

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install shaker with typecheck dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group typecheck
      - name: Run mypy
        run: mypy shaker/

  test:
    runs-on: ubuntu-latest
    needs: [pre-commit, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install shaker with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group test
      - name: Run pytest
        run: pytest -v tests/
