name: Python Code Quality
on: [push]
jobs:
  lock_file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: uv lock --locked
  linting:
    runs-on: ubuntu-latest
    needs: [lock_file]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: uvx ruff check .
  formatting:
    runs-on: ubuntu-latest
    needs: [lock_file]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: uvx ruff format --check .
  type_consistency:
    runs-on: ubuntu-latest
    needs: [lock_file, linting, formatting]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install shaker with typecheck dependencies
        run: uv sync --locked --group typecheck
      - name: Run mypy
        run: uv run mypy shaker/
  test:
    runs-on: ubuntu-latest
    needs: [lock_file, linting, formatting, type_consistency]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install shaker with test dependencies
        run: uv sync --locked --group test
      - name: Run pytest
        run: uv run --locked pytest -v tests/